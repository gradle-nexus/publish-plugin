name: CI

on:
  push:
    branches:
      - master
      - "szpak/**"
      - "marc/**"
  pull_request:
    branches:
      - '*'
  merge_group:

jobs:
  gradle:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Setup compiler JDK 8
      id: java8
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 8
        distribution: 'zulu'

    - name: Setup compiler JDK 17
      id: java17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 17
        distribution: 'zulu'

    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 11
        distribution: 'zulu'

    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4

    - name: "Build and Test"
      env:
        NEXUS_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        NEXUS_JAVA17_HOME: ${{ steps.java17.outputs.path }}
      run: >-
        ./gradlew --stacktrace build compatTestJava11
        "-Porg.gradle.java.installations.fromEnv=NEXUS_JAVA8_HOME,NEXUS_JAVA17_HOME,JAVA_HOME"
        "-Porg.gradle.java.installations.auto-download=false"
        "-Porg.gradle.java.installations.auto-detect=false"

  gradle-9:
    name: "Gradle 9.8.1 (Java 17)"
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Setup compiler JDK 8
      id: java8
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 8
        distribution: 'zulu'

    - name: Setup compiler JDK 17
      id: java17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 17
        distribution: 'zulu'

    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 17
        distribution: 'zulu'

    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4

    - name: Select Gradle 9.8.1 compatibility fixtures
      run: printf 'java17=9.8.1\n' > stutter.lockfile

    - name: "Build and Test"
      env:
        NEXUS_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        NEXUS_JAVA17_HOME: ${{ steps.java17.outputs.path }}
      run: >-
        ./gradlew --stacktrace assemble legacyCheck compatTestJava17
        "-Porg.gradle.java.installations.fromEnv=NEXUS_JAVA8_HOME,NEXUS_JAVA17_HOME,JAVA_HOME"
        "-Porg.gradle.java.installations.auto-download=false"
        "-Porg.gradle.java.installations.auto-detect=false"

  production-settings:
    name: "Production Settings mode (Java 17)"
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

    - name: Setup compiler JDK 8
      id: java8
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 8
        distribution: 'zulu'

    - name: Setup host and compiler JDK 17
      id: java17
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
      with:
        java-version: 17
        distribution: 'zulu'

    - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4

    - name: Test production Settings mode
      env:
        NEXUS_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        NEXUS_JAVA17_HOME: ${{ steps.java17.outputs.path }}
      run: >-
        ./gradlew --stacktrace spotlessCheck validateSettingsPlugins settingsTest
        "-Porg.gradle.java.installations.fromEnv=NEXUS_JAVA8_HOME,NEXUS_JAVA17_HOME,JAVA_HOME"
        "-Porg.gradle.java.installations.auto-download=false"
        "-Porg.gradle.java.installations.auto-detect=false"
